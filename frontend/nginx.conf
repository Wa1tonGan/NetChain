# NetChain SPA + the same-origin proxies Vite's dev server provided in
# development. Calls with absolute VITE_GATEWAY_URL / VITE_TRUST_URL bypass
# nginx entirely (both upstreams send CORS *); these locations only serve the
# RELATIVE fetches the app still makes:
#   /v1/...            -> trust server   (demo commit/settle, Walrus archive)
#   /suirpc[...]       -> Sui testnet JSON-RPC (wallet/escrow balance reads)
# /api/zklogin/* has no upstream on purpose — zkLogin is not part of the
# demo stack, it answers 404.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed Vite assets — cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Trust server (keep the /v1 prefix — the trust API serves /v1/*).
  # Docker's embedded DNS re-resolves the service name if it restarts.
  location /v1/ {
    resolver 127.0.0.11 valid=10s;
    set $trust_upstream http://trust:8200;
    proxy_pass $trust_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;               # ledger SSE must not buffer
    proxy_read_timeout 120s;
  }

  # Sui testnet JSON-RPC — strip the /suirpc prefix, forward to the fullnode.
  location /suirpc {
    resolver 127.0.0.11 valid=30s;
    set $sui_rpc https://sui-testnet-rpc.publicnode.com;
    rewrite ^/suirpc$ / break;
    rewrite ^/suirpc(/.*)$ $1 break;
    proxy_pass $sui_rpc;
    proxy_http_version 1.1;
    proxy_set_header Host sui-testnet-rpc.publicnode.com;
    proxy_ssl_server_name on;
    proxy_read_timeout 60s;
  }

  location /suirpc-backup {
    resolver 127.0.0.11 valid=30s;
    set $sui_rpc_backup https://testnet.sui.rpcpool.com;
    rewrite ^/suirpc-backup$ / break;
    rewrite ^/suirpc-backup(/.*)$ $1 break;
    proxy_pass $sui_rpc_backup;
    proxy_http_version 1.1;
    proxy_set_header Host testnet.sui.rpcpool.com;
    proxy_ssl_server_name on;
    proxy_read_timeout 60s;
  }

  # SPA fallback (the app uses a hash router; deep links stay safe anyway)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
